# Docker embedded DNS resolver — required because we use a variable in proxy_pass
resolver 127.0.0.11 valid=10s;

# Map Host header -> backend upstream
map $host $backend_host {
    web1.example.net    web1:443;
    web2.example.net    web2:443;
    default             web1:443;   # fallback
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name *.example.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.example.net;

    ssl_certificate     /etc/nginx/certs/proxy.crt;
    ssl_certificate_key /etc/nginx/certs/proxy.key;

    location / {
        set $upstream https://$backend_host;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- mTLS: proxy authenticates itself to web1/web2 ----
        proxy_ssl_certificate         /etc/nginx/certs/client.crt;
        proxy_ssl_certificate_key     /etc/nginx/certs/client.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_server_name         on;
        # proxy_ssl_name                $host;
        proxy_ssl_name                $backend_host;
    }
}

