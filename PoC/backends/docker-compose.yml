services:
  web1:
    image: nginx:stable
    container_name: web1
    ports:
      - "8443:443"
    volumes:
      - ./nginx1/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx1/html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - mtls-net

  web2:
    image: nginx:stable
    container_name: web2
    ports:
      - "8444:443"
    volumes:
      - ./nginx2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx2/html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - mtls-net

networks:
  mtls-net:
    external: true
