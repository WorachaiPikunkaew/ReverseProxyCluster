apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-nginx-conf
  namespace: mtls-proxy
data:
  default.conf: |
    server {
        listen 80;
        server_name *.example.net;
        return 301 https://$host$request_uri;
    }

    # --- web1.example.net -> web1 (static resolve via /etc/hosts) ---
    server {
        listen 443 ssl;
        server_name web1.example.net;

        ssl_certificate     /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;

        location / {
            proxy_pass https://web1:443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_ssl_certificate         /etc/nginx/certs/client.crt;
            proxy_ssl_certificate_key     /etc/nginx/certs/client.key;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
            proxy_ssl_verify              on;
            proxy_ssl_verify_depth        2;
            proxy_ssl_server_name         on;
            proxy_ssl_name                web1;
        }
    }

    # --- web2.example.net -> web2 (static resolve via /etc/hosts) ---
    server {
        listen 443 ssl;
        server_name web2.example.net;

        ssl_certificate     /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;

        location / {
            proxy_pass https://web2:443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_ssl_certificate         /etc/nginx/certs/client.crt;
            proxy_ssl_certificate_key     /etc/nginx/certs/client.key;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
            proxy_ssl_verify              on;
            proxy_ssl_verify_depth        2;
            proxy_ssl_server_name         on;
            proxy_ssl_name                web2;
        }
    }

